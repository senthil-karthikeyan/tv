<main class="min-h-screen bg-slate-950 p-10 text-white">
  <header class="mb-10">
    <h1 class="text-4xl font-semibold">Scene Launcher</h1>
    <p class="mt-2 text-slate-400">Scenes loaded from the server</p>
  </header>

  @if (scenesResource.isLoading()) {
    <p class="text-slate-400">Loading scenes...</p>
  } @else if (scenesResource.error()) {
    <p class="text-red-400">Could not load scenes.</p>
  } @else {
    <h2 class="mb-6 text-2xl">Pick a scene</h2>

    <div focusGroup [autofocus]="true" class="grid grid-cols-3 gap-6">
      @for (scene of scenes(); track scene.id) {
        <a
          focusItem
          [routerLink]="scene.route"
          (click)="openScene(scene)"
          (focus)="onFocus(scene)"
          class="block rounded-2xl bg-slate-800 p-8 text-left focus:outline-none focus:ring-4 focus:ring-sky-400"
        >
          <p class="text-2xl font-medium">{{ scene.name }}</p>
          <p class="mt-2 text-slate-400">{{ scene.label }}</p>
        </a>
      }
    </div>
  }
</main>
